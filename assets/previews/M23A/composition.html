<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DHESS About closing sections · Artwork review</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="composition.css">
  </head>
  <body class="about-page">
    <main>
      <section class="about-get-to-know" aria-labelledby="about-get-to-know-title">
        <div class="about-get-to-know__inner">
          <div class="about-get-to-know__copy">
            <h2 id="about-get-to-know-title">Get to know Dhess.</h2>
            <p>Explore the board and pieces, then take your first steps with the game guide.</p>
            <div class="about-get-to-know__links">
              <a href="../../../learn.html">Learn to play <span aria-hidden="true">→</span></a>
              <a href="../../../shop.html">Explore the game <span aria-hidden="true">→</span></a>
            </div>
          </div>
          <div class="about-get-to-know__art">
            <img class="about-get-to-know__mystic" src="../../../public/images/learn/pieces/mystic.webp"
              width="372" height="736" loading="lazy" decoding="async" alt="Ivory Mystic with a pointed hood">
            <img class="about-get-to-know__knight" src="../../../public/images/learn/pieces/knight.webp"
              width="423" height="736" loading="lazy" decoding="async" alt="Ivory Knight with a carved horse head">
          </div>
        </div>
      </section>
      <section class="about-closing" aria-labelledby="about-closing-title">
        <div class="about-closing__inner">
          <div class="about-closing__copy">
            <span class="about-closing__rule" aria-hidden="true"></span>
            <h2 id="about-closing-title">Your next chapter starts at the table.</h2>
            <a class="button button-gold" href="../../../shop.html">Shop the game <span aria-hidden="true">→</span></a>
          </div>
          <img class="about-closing__box" src="../../../public/images/home/product-box-concept.webp"
            width="1563" height="1006" loading="lazy" decoding="async"
            alt="Concept DHESS European Edition game box with illustrated front artwork">
        </div>
        <img class="about-closing__velvet" src="../../../public/images/shared/burgundy-velvet.webp"
          width="2172" height="724" loading="lazy" decoding="async" alt="">
      </section>
    </main>
  </body>
</html>
