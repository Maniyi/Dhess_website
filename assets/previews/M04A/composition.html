<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meet your next move — artwork review</title>
    <style>
      @font-face {
        font-family: 'Cormorant Garamond';
        src: url('../../../public/fonts/CormorantGaramond-600-latin.woff2') format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      :root {
        --charcoal: #141210;
        --ivory: #f8e5c5;
        --gold: #f0b54e;
        --gold-light: #ffe0a1;
        --display: 'Cormorant Garamond', Georgia, serif;
        --interface: Georgia, 'Times New Roman', serif;
        --body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--charcoal); color: var(--ivory); }
      .next-move {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: clamp(430px, 37.5vw, 570px);
        border-bottom: 1px solid #b48643;
        background: var(--charcoal) url('../../../public/images/home/next-move-background.webp') center / cover no-repeat;
      }
      .next-move__inner {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: minmax(0, 60%) minmax(0, 40%);
        align-items: center;
        width: min(100%, 1536px);
        min-height: inherit;
        margin: auto;
      }
      .next-move__art {
        position: relative;
        align-self: stretch;
        min-width: 0;
      }
      .next-move__art img {
        position: absolute;
        left: 0;
        bottom: -8%;
        display: block;
        width: min(100%, 900px);
        height: auto;
      }
      .next-move__copy {
        position: relative;
        padding: 50px clamp(28px, 4.1vw, 64px) 82px clamp(48px, 4vw, 62px);
      }
      .next-move__copy::before {
        content: '';
        position: absolute;
        top: 50%;
        bottom: 50%;
        left: 0;
        height: min(320px, 66%);
        width: 1px;
        background: linear-gradient(transparent, #bb893d 10%, #bb893d 90%, transparent);
        transform: translateY(-50%);
      }
      .next-move__ornament {
        position: absolute;
        top: 50%;
        left: 0;
        transform: translate(-50%, -50%);
        color: var(--gold);
        font: 400 28px/1 var(--interface);
        text-shadow: 0 1px 4px #000;
      }
      h1 {
        max-width: 490px;
        margin: 0 0 14px;
        color: var(--gold-light);
        font: 600 clamp(59px, 5.25vw, 82px)/.83 var(--display);
        letter-spacing: -.025em;
        text-shadow: 0 2px 9px #0009;
      }
      p {
        max-width: 440px;
        margin: 0 0 21px;
        color: #f5f0e8;
        font: 400 clamp(17px, 1.3vw, 20px)/1.4 var(--body);
      }
      .next-move__link {
        display: inline-block;
        padding-bottom: 3px;
        border-bottom: 1px solid currentColor;
        color: var(--gold);
        font: 400 clamp(18px, 1.4vw, 22px)/1.2 var(--interface);
      }
      .next-move__cloth {
        position: absolute;
        z-index: 3;
        left: 0;
        bottom: -9.4vw;
        display: block;
        width: 100%;
        height: auto;
        pointer-events: none;
      }
      @media (max-width: 700px) {
        .next-move { min-height: 0; background-position: 35% center; }
        .next-move__inner { display: flex; flex-direction: column; min-height: 0; }
        .next-move__copy { order: 0; align-self: stretch; padding: 42px 24px 10px; }
        .next-move__copy::before, .next-move__ornament { display: none; }
        h1 { max-width: 370px; margin-bottom: 18px; font-size: clamp(52px, 13.7vw, 63px); line-height: .85; }
        p { max-width: 350px; margin-bottom: 18px; font-size: 17px; line-height: 1.43; }
        .next-move__link { font-size: 19px; }
        .next-move__art { order: 1; align-self: stretch; width: 100%; margin: 13px auto 53px; overflow: hidden; }
        .next-move__art img { position: relative; left: -20%; bottom: auto; width: 140%; max-width: none; height: auto; }
        .next-move__cloth { bottom: -4px; width: 100%; }
      }
      @media (max-width: 350px) {
        .next-move__copy { padding-inline: 19px; }
        h1 { font-size: 51px; }
        p { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <section class="next-move" aria-labelledby="next-move-heading">
      <div class="next-move__inner">
        <div class="next-move__art"><img src="../../../public/images/home/next-move-pieces.webp" width="1536" height="1024" alt="Ivory king, hooded figure and horse-headed game pieces"></div>
        <div class="next-move__copy">
          <span class="next-move__ornament" aria-hidden="true">⚜</span>
          <h1 id="next-move-heading">Meet your<br>next move.</h1>
          <p>Discover the pieces and explore the board before your first game.</p>
          <span class="next-move__link">Learn how to play →</span>
        </div>
      </div>
      <img class="next-move__cloth" src="../../../public/images/shared/burgundy-velvet.webp" width="2172" height="724" alt="" aria-hidden="true">
    </section>
  </body>
</html>
