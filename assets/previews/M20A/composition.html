<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

  <body>
    <main>
      <section class="about-idea" aria-labelledby="about-idea-title">
        <div class="about-idea__inner">
          <div class="about-idea__copy">
            <p class="about-idea__eyebrow">THE IDEA</p>
            <h2 id="about-idea-title">See the board<br>differently.</h2>
            <p>A board can be more than a field of squares. It can suggest a world of places, characters, and possibilities.</p>
            <p>Dhess invites you to bring curiosity to the table and discover the European Edition, one piece at a time.</p>
          </div>
          <div class="about-idea__scene" role="img" aria-label="An ivory Knight and Rook stand at the corner of an angled board with European landmark illustrations and colourful resource symbols.">
            <div class="about-idea__assembly">
              <img class="about-idea__board"
                src="../../../public/images/about/idea-board-angle.webp"
                srcset="../../../public/images/about/idea-board-angle-780.webp 780w, ../../../public/images/about/idea-board-angle.webp 1560w"
                sizes="(max-width: 760px) 142vw, (max-width: 952px) 790px, (max-width: 1600px) 83vw, 1328px"
                alt="" width="1560" height="1100">
              <div class="about-idea__piece about-idea__piece--knight">
                <img src="../../../public/images/learn/pieces/knight.webp" alt="" width="423" height="736">
              </div>
              <div class="about-idea__piece about-idea__piece--rook">
                <img src="../../../public/images/learn/pieces/rook.webp" alt="" width="429" height="736">
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
