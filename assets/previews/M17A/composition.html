<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Shop closing banners · Milestone 17A</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="composition.css">
  </head>
  <body class="shop-page">
    <main>
      <section class="shop-learning" aria-labelledby="shop-learning-title">
        <div class="shop-learning__inner">
          <div class="shop-learning__copy">
            <h2 id="shop-learning-title">Curious about your first move?</h2>
            <p>Explore the board and meet the pieces before you play.</p>
            <a class="button button-outline" href="../../../learn.html">Learn to play <span aria-hidden="true">→</span></a>
          </div>
          <span class="shop-learning__rule" aria-hidden="true">⚜︎</span>
          <div class="shop-learning__scene" role="img" aria-label="An ivory horse-headed knight on a close-up of the illustrated board, with landmark engravings and coloured resource motifs.">
            <img class="shop-learning__room" src="../../../public/images/learn/getting-started-pieces-background.webp" width="960" height="600" alt="">
            <img class="shop-learning__board" src="../../../public/images/learn/learn-board-illustrated.webp" width="1360" height="1156" alt="">
            <img class="shop-learning__knight" src="../../../public/images/learn/pieces/knight.webp" width="423" height="736" alt="">
          </div>
        </div>
        <img class="shop-learning__velvet" src="../../../public/images/shared/burgundy-velvet.webp" width="2172" height="724" alt="">
      </section>
      <section class="shop-closing-purchase" aria-labelledby="shop-closing-purchase-title">
        <img class="shop-closing-purchase__scenery" src="../../../public/images/learn/hero-scenery-mobile.webp" width="932" height="500" alt="">
        <div class="shop-closing-purchase__inner">
          <div class="shop-closing-purchase__heading">
            <h2 id="shop-closing-purchase-title">Bring Dhess to your table.</h2>
          </div>
          <span class="button button-gold pending-action">Buy the game <span aria-hidden="true">↗</span> <small>Unavailable</small></span>
        </div>
      </section>
    </main>
  </body>
</html>
