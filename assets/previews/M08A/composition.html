<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DHESS Learn — The board artwork preview</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../../styles.css">
    <style>
      .learn-board {
        position: relative;
        isolation: isolate;
        color: #3b291b;
        background: #efd3a5 url('../../../public/images/home/european-intro-paper-tile.webp') center top / 300px repeat;
        border-block: 1px solid var(--line);
      }

      .learn-board::before {
        content: '';
        position: absolute;
        z-index: -1;
        inset: 0;
        background: url('../../../public/images/home/european-intro-background-desktop.webp') center top / 100% auto no-repeat;
        opacity: .58;
        mask-image: linear-gradient(90deg, #000 9%, transparent 17%, transparent 78%, #000 94%);
      }

      .learn-board__inner {
        display: grid;
        grid-template-columns: minmax(0, 36fr) minmax(0, 64fr);
        align-items: center;
        gap: clamp(16px, 1.65vw, 26px);
        width: min(100%, 1536px);
        margin-inline: auto;
        padding: clamp(22px, 2.45vw, 38px) clamp(20px, 2.2vw, 34px) clamp(22px, 2.45vw, 38px) clamp(112px, 15.1vw, 232px);
      }

      .learn-board__eyebrow {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 0 0 15px;
        color: #851e18;
        font: 700 clamp(12px, 1.2vw, 17px)/1.2 var(--font-interface);
        letter-spacing: .14em;
      }

      .learn-board__eyebrow::after {
        content: '';
        flex: 1 1 28px;
        max-width: 146px;
        height: 1px;
        background: var(--line);
      }

      .learn-board h2 {
        margin: 0 0 15px;
        color: #302015;
        font: 600 clamp(40px, 5.5vw, 84px)/.9 var(--font-display);
      }

      .learn-board__description {
        max-width: 35ch;
        margin: 0;
        font: 400 clamp(16px, 1.5vw, 22px)/1.4 var(--font-body);
      }

      .learn-board__art {
        width: min(100%, 710px);
        justify-self: center;
      }

      .learn-board__art img {
        display: block;
        width: 100%;
        height: auto;
        margin-block: 0;
        filter: drop-shadow(0 6px 5px rgb(60 36 15 / 26%));
      }

      @media (max-width: 760px) {
        .learn-board::before {
          background-image: url('../../../public/images/home/european-intro-background-mobile.webp');
          opacity: .54;
          mask-image: linear-gradient(#000 9%, transparent 30%);
        }

        .learn-board__inner {
          grid-template-columns: minmax(0, 1fr);
          gap: 26px;
          max-width: 490px;
          padding: clamp(106px, 31vw, 228px) clamp(20px, 6vw, 36px) 32px;
        }

        .learn-board h2 { font-size: clamp(46px, 13vw, 72px); }
        .learn-board__description { max-width: 32ch; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="learn-board" aria-labelledby="board-title">
        <div class="learn-board__inner">
          <div class="learn-board__copy">
            <p class="learn-board__eyebrow">01 / THE BOARD</p>
            <h2 id="board-title">Explore a<br>wider world.</h2>
            <p class="learn-board__description">A 10 × 10 board brings European landmarks and resources to the table.</p>
          </div>
          <div class="learn-board__art">
            <img src="../../../public/images/learn/learn-board-illustrated.webp" width="1360" height="1156" alt="Illustrated 10 × 10 board with European landmarks, colorful resource motifs, and a gilded walnut frame">
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
