<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product box transparent edge check</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 Arial, sans-serif; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    section { min-width: 0; min-height: 470px; padding: 22px; text-align: center; }
    section:first-child { color: #f8e5c5; background: #141210; }
    section:last-child { color: #301b13; background: #f4e4cb; }
    img { display: block; width: min(100%, 700px); height: auto; margin: 20px auto 0; }
    @media (max-width: 700px) { main { display: block; } section { min-height: 0; } }
  </style>
</head>
<body>
  <main>
    <section><h1>Charcoal</h1><img src="../../../public/images/home/product-box-concept.webp" width="1563" height="1006" alt="Concept box on charcoal background"></section>
    <section><h1>Ivory</h1><img src="../../../public/images/home/product-box-concept.webp" width="1563" height="1006" alt="Concept box on ivory background"></section>
  </main>
</body>
</html>
