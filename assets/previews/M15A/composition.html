<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DHESS Shop piece lineup preview</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="composition.css">
  </head>
  <body>
    <main>
      <section class="shop-lineup" aria-labelledby="lineup-title">
        <div class="shop-lineup__heading">
          <span class="shop-lineup__rule" aria-hidden="true">⚜︎</span>
          <h2 id="lineup-title">Every piece has a presence.</h2>
          <span class="shop-lineup__rule" aria-hidden="true">⚜︎</span>
        </div>

        <ul class="shop-lineup__pieces" role="list">
          <li>
            <img src="../../../public/images/learn/pieces/king.webp" width="421" height="736" alt="King">
          </li>
          <li style="--piece-scale: .92">
            <img src="../../../public/images/learn/pieces/queen.webp" width="348" height="736" alt="Queen">
          </li>
          <li style="--piece-scale: .91">
            <img src="../../../public/images/learn/pieces/bishop.webp" width="396" height="736" alt="Bishop">
          </li>
          <li style="--piece-scale: .86">
            <img src="../../../public/images/learn/pieces/rook.webp" width="429" height="736" alt="Rook">
          </li>
          <li style="--piece-scale: .78; --base-padding: .01223">
            <img src="../../../public/images/learn/pieces/mystic.webp" width="372" height="736" alt="Mystic">
          </li>
          <li style="--piece-scale: .77">
            <img src="../../../public/images/learn/pieces/knight.webp" width="423" height="736" alt="Knight">
          </li>
          <li style="--piece-scale: .72">
            <img src="../../../public/images/learn/pieces/pawn.webp" width="389" height="736" alt="Pawn">
          </li>
        </ul>

        <img class="shop-lineup__cloth" src="../../../public/images/shared/burgundy-velvet.webp" width="2172" height="724" alt="">
      </section>
    </main>
  </body>
</html>
