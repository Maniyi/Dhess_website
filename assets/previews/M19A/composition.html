<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DHESS About hero artwork review</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="composition.css">
</head>
<body>
  <main>
    <section class="about-hero" aria-labelledby="about-title">
      <div class="about-hero__inner">
        <div class="about-hero__copy">
          <p class="about-hero__eyebrow">About Dhess</p>
          <h1 id="about-title">A familiar game.<br>A wider world.</h1>
          <p class="about-hero__description">Dhess: European Edition brings a new landscape to the strategy table, with distinctive pieces, landmarks, and resources to explore.</p>
        </div>
        <div class="about-hero__scene" role="img" aria-label="Ivory King, Mystic and Queen on an illustrated board, with a mountain castle in the distance.">
          <picture class="about-hero__scenery">
            <source media="(max-width: 760px)" srcset="../../../public/images/learn/hero-scenery-mobile.webp" width="932" height="500">
            <img src="../../../public/images/home/hero-background-desktop.webp" width="1672" height="941" alt="">
          </picture>
          <img class="about-hero__board" src="../../../public/images/learn/learn-board-illustrated.webp" width="1360" height="1156" alt="">
          <div class="about-hero__piece about-hero__piece--queen">
            <img src="../../../public/images/learn/pieces/queen.webp" width="348" height="736" alt="">
          </div>
          <div class="about-hero__piece about-hero__piece--mystic">
            <img src="../../../public/images/learn/pieces/mystic.webp" width="372" height="736" alt="">
          </div>
          <div class="about-hero__piece about-hero__piece--king">
            <img src="../../../public/images/learn/pieces/king.webp" width="421" height="736" alt="" fetchpriority="high">
          </div>
          <img class="about-hero__velvet" src="../../../public/images/shared/burgundy-velvet.webp" width="2172" height="724" alt="">
        </div>
      </div>
    </section>
    <div class="about-tagline">
      <p>
        <span class="about-tagline__ornament" aria-hidden="true">⚜&#xfe0e;</span>
        Go beyond chess.
        <span class="about-tagline__ornament" aria-hidden="true">⚜&#xfe0e;</span>
      </p>
    </div>
  </main>
</body>
</html>
