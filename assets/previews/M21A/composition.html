<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>About | European Edition detail cards preview</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="composition.css">
  </head>
  <body>
    <main>
      <section class="about-details" aria-labelledby="about-details-title">
        <div class="about-details__inner">
          <p class="about-details__eyebrow">THE EUROPEAN EDITION</p>
          <h2 id="about-details-title">A world reflected in the details.</h2>
          <ul class="about-details__cards" role="list">
            <li>
              <div class="about-details__frame">
                <img src="../../../public/images/about/detail-landmarks.webp" width="832" height="468"
                  alt="The Colosseum and Eiffel Tower engraved on ivory-coloured board squares.">
              </div>
              <h3>Landmarks</h3>
              <p>Recognisable places woven into the board.</p>
            </li>
            <li>
              <div class="about-details__frame">
                <img src="../../../public/images/about/detail-resources.webp" width="832" height="468"
                  alt="Gold, blue fish, flame, timber and ore illustrations on board squares.">
              </div>
              <h3>Resources</h3>
              <p>A landscape rich in visual character.</p>
            </li>
            <li>
              <div class="about-details__frame">
                <img src="../../../public/images/about/detail-characters.webp" width="832" height="468"
                  alt="An ivory King, Queen and hooded Mystic, shown from the waist up.">
              </div>
              <h3>Characters</h3>
              <p>European-inspired figures with a presence of their own.</p>
            </li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
